<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>PCS integration harness</title>
<style>
  body { background:#0b0f14; color:#c9d3de; font:12px/1.5 ui-monospace,monospace; margin:0; padding:14px; }
  h1 { font-size:13px; }
</style>
</head>
<body>
<h1>Planetary Climate Sim - browser integration harness</h1>
<pre id="out">booting…</pre>
<div id="harness-marker">HARNESS_RESULT total=0 failed=0</div>
<iframe id="app-frame" src="/index.html" style="width:1700px;height:1000px;position:absolute;left:-4200px;top:0;border:0"></iframe>
<script type="module">
const log = [];
const results = [];
const outEl = document.getElementById('out');
const markerEl = document.getElementById('harness-marker');

function render() {
  outEl.textContent = log.join('\n');
  const failed = results.filter((r) => !r.ok);
  markerEl.textContent = 'HARNESS_RESULT total=' + results.length + ' failed=' + failed.length + ' ' +
    failed.map((f) => f.name).join(' | ');
}
function report(name, ok, detail) {
  results.push({ name, ok, detail: detail === undefined ? null : detail });
  log.push((ok ? 'PASS ' : 'FAIL ') + name +
    (detail !== undefined && detail !== null ? '  ::  ' + JSON.stringify(detail) : ''));
  render();
}

window.addEventListener('error', (e) => report('window.error', false, String(e.message)));
window.addEventListener('unhandledrejection', (e) =>
  report('unhandledrejection', false, String((e.reason && e.reason.message) || e.reason)));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** Cheap order-sensitive checksum so we can tell whether a grid changed. */
function checksum(arr) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < arr.length; i += 7) {
    h ^= Math.round(arr[i]) & 0xff;
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h.toString(16);
}

function scanFinite(w) {
  let bad = 0;
  for (const key of ['T', 'albedo', 'precip', 'vegetation', 'habitability', 'ice']) {
    const arr = w.grid[key];
    if (!arr) continue;
    for (let i = 0; i < arr.length; i++) if (!isFinite(arr[i])) bad++;
  }
  return bad;
}

async function main() {
  const frame = document.getElementById('app-frame');
  await new Promise((res) => frame.addEventListener('load', res, { once: true }));
  const cw = frame.contentWindow;
  const doc = frame.contentDocument;
  // Surface exceptions raised inside the app frame: main.js wraps the render
  // loop in try/catch, so a broken overlay would otherwise fail silently.
  cw.addEventListener('error', (e) => report('frame error', false,
    String((e.error && e.error.stack) || e.message || e)));
  cw.addEventListener('unhandledrejection', (e) =>
    report('frame unhandledrejection', false, String((e.reason && e.reason.message) || e.reason)));
  for (let i = 0; i < 120 && !cw.__pcs; i++) await sleep(100);

  report('app boots (window.__pcs present)', !!cw.__pcs);
  if (!cw.__pcs) { finish(); return; }
  const api = cw.__pcs;

  /* ---------------- DOM contract ---------------- */
  const requiredIds = ['topbar','leftPanel','rightPanel','globe','layerStrip','legendBar','presetSel','btnNewPlanet',
    'btnSave','btnLoad','btnFileSave','btnFileLoad','btnPlay','btnBranch','branchSel','btnTerrain','timeScrub','scrubLabel',
    'unitSel','btnExport','btnUndo','btnRedo','btnHelp','paramSections','paramSearch','lockSummary','chkAutoDerive',
    'probeTip','toast','baseLayerSeg','metricGrid','charts','probeBody','probeCard','condList','scopeLabel','btnClearRegion',
    'overlay','wizard','terrainEditor','slots','slotList','exportModal','help','wizSteps','wizModes','wizPanes',
    'wizBack','wizNext','wizCreate','hudName','hudRadius','hudGravity','hudStar','hudCursor','simClock'];
  const missing = requiredIds.filter((id) => !doc.getElementById(id));
  report('index.html contains every required element', missing.length === 0, missing);

  const rows = doc.querySelectorAll('#paramSections .prow');
  const locks = doc.querySelectorAll('#paramSections .lock-btn');
  const sliders = doc.querySelectorAll('#paramSections input[type=range]');
  report('parameter panel built every row', rows.length >= 50 && locks.length === rows.length,
    { rows: rows.length, locks: locks.length });
  report('slider widgets present', sliders.length >= 40, { sliders: sliders.length });

  const layerBtns = doc.querySelectorAll('#layerStrip .layer-btn');
  report('layer strip has 16 data layers plus none', layerBtns.length === 17, { count: layerBtns.length });
  const vectorBtns = Array.from(layerBtns).filter((b) => b.dataset.layer === 'windSpeed' || b.dataset.layer === 'currentSpeed');
  report('风场 / 洋流 layers are present',
    vectorBtns.length === 2 && vectorBtns[0].textContent === '风场' && vectorBtns[1].textContent === '洋流',
    vectorBtns.map((b) => b.textContent));

  const metricCards = doc.querySelectorAll('#metricGrid .metric');
  const chartCards = doc.querySelectorAll('#charts .chart-card');
  // 7, not 6: the panel shows the instantaneous global mean *and* its 12-month mean.
  // The 12-month mean is the steady-state indicator — the instantaneous value swings
  // ~4 K peak-to-peak with the seasonal cycle and so cannot show slow drift.
  report('data panel built metric cards', metricCards.length === 7, { cards: metricCards.length });
  report('data panel built charts', chartCards.length === 7, { charts: chartCards.length });
  {
    const labels = Array.from(doc.querySelectorAll('#metricGrid .m-label')).map((n) => n.textContent);
    report('the 12-month mean has its own card',
      labels.length === 7 && labels[1].indexOf('12 月均值') >= 0, labels);
  }

  /* ---------------- globe ---------------- */
  const g = api.globePane.globe;
  report('WebGL context created', g.ok === true, g.error || 'ok');
  if (g.ok) {
    const rect = g.canvas.getBoundingClientRect();
    const pos = g.project(0, 0);
    report('globe.project returns an on-canvas point',
      !!pos && isFinite(pos.x) && isFinite(pos.y) && pos.x > 0 && pos.x < rect.width && pos.y > 0 && pos.y < rect.height,
      pos && { x: Math.round(pos.x), y: Math.round(pos.y) });
    const picked = g.pick(rect.left + rect.width / 2, rect.top + rect.height / 2);
    report('globe.pick round-trips a screen point',
      !!picked && isFinite(picked.lat) && isFinite(picked.lon) && Math.abs(picked.lat) <= 90,
      picked && { lat: +picked.lat.toFixed(1), lon: +picked.lon.toFixed(1) });

    const gl = g.gl;
    const w = g.canvas.width, h = g.canvas.height;
    const frameStats = () => {
      g.render(0);
      const px = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      let lit = 0, sum = 0, max = 0;
      const uniq = new Set();
      for (let i = 0; i < px.length; i += 4) {
        const lum = px[i] + px[i + 1] + px[i + 2];
        if (lum > 60) lit++;
        sum += lum / 3;
        if (lum > max) max = lum;
        uniq.add((px[i] >> 4) + ',' + (px[i + 1] >> 4) + ',' + (px[i + 2] >> 4));
      }
      return { lit, coverage: +(lit / (w * h)).toFixed(3), meanLum: +(sum / (w * h)).toFixed(1), maxLum: max, colors: uniq.size };
    };
    // let the app's own render loop upload the base map at least once
    await sleep(400);
    g.render(0);
    const s0 = frameStats();
    report('globe renders a lit sphere', s0.coverage > 0.25 && s0.meanLum > 10, s0);
    report('globe texture has many distinct colours', s0.colors > 40, { colors: s0.colors });

    const perLayer = {};
    for (const layer of ['temperature', 'precipitation', 'vegetation', 'habitability', 'oxygen']) {
      api.setOverlay(layer);
      await sleep(220);
      perLayer[layer] = frameStats().colors;
    }
    api.setOverlay('none');
    await sleep(150);
    report('every data layer changes the rendered image',
      perLayer.temperature > 20 && perLayer.vegetation > 20 && perLayer.habitability > 20, perLayer);
  }

  /* ---------------- live simulation through the UI ---------------- */
  const world = api.world();
  const framesBefore = api.loopStats.frames;
  doc.getElementById('btnPlay').click();
  api.clock.setSpeed(25);
  // The clock is normally driven by requestAnimationFrame; headless/offscreen
  // pages may throttle it, so drive a deterministic burst as well and report
  // the observed frame count separately.
  await sleep(2500);
  const framesDelta = api.loopStats.frames - framesBefore;
  // Drive several deterministic advances rather than relying on animation frames,
  // which headless/offscreen pages throttle.
  const beforeManual = world.time.month;
  for (let i = 0; i < 6; i++) api.clock.advance(world, 96);
  doc.getElementById('btnPlay').click();
  const advancedByClock = world.time.month;
  report('animation loop is running', framesDelta > 20 || advancedByClock > beforeManual,
    { frames: framesDelta, monthsByClock: Math.round(beforeManual) });
  report('clock advances the simulation', advancedByClock > 300,
    { months: Math.round(advancedByClock), tGlobal: +world.tGlobal.toFixed(2) });
  report('time series is sampled', world.series.length() > 300, { samples: world.series.length() });

  const met = world.metrics();
  report('mean surface temperature is physical', met.tGlobal > 200 && met.tGlobal < 340, +met.tGlobal.toFixed(2));
  report('planetary albedo is physical', met.albedo > 0.05 && met.albedo < 0.85, +met.albedo.toFixed(4));
  report('energy budget closes', Math.abs(met.energy) < 60, +met.energy.toFixed(3));
  report('sea level change is plausible', Math.abs(met.seaLevel) < 400, +met.seaLevel.toFixed(2));

  const layerKeys = ['temperature','precipitation','precipSeason','humidity','vegetation','oxygen',
    'habitability','toxicity','aerosol','diurnal','seasonal','rivers','seaIce','anomaly'];
  const layerReport = {};
  let layersOk = true;
  for (const key of layerKeys) {
    const data = world.layerData(key);
    const rng = world.layerRange(key);
    let finite = 0;
    for (let i = 0; i < data.length; i++) if (isFinite(data[i])) finite++;
    const ok = finite === data.length && isFinite(rng.min) && isFinite(rng.max);
    layerReport[key] = ok ? rng.min.toFixed(2) + '..' + rng.max.toFixed(2) : 'BAD';
    if (!ok) layersOk = false;
  }
  report('all 14 data layers compute finite values', layersOk, layerReport);

  /* ---------------- probe + region linkage ---------------- */
  const probe = world.probe(31.2, 121.5, 6);
  report('probe read-out is complete',
    ['tempK','precip','humidity','vegetation','habitability','toxicity','diurnal','biome']
      .every((k) => probe[k] !== undefined),
    { t: +probe.tempK.toFixed(1), biome: probe.biome.label });

  const rect2 = g.canvas.getBoundingClientRect();
  const clickOpts = { bubbles: true, clientX: rect2.left + rect2.width * 0.52, clientY: rect2.top + rect2.height * 0.44, pointerId: 1 };
  g.canvas.dispatchEvent(new cw.PointerEvent('pointerdown', clickOpts));
  g.canvas.dispatchEvent(new cw.PointerEvent('pointerup', clickOpts));
  await sleep(400);
  report('clicking the globe creates a probe region', !!api.state.ui.region,
    api.state.ui.region && { lat: +api.state.ui.region.lat.toFixed(1), lon: +api.state.ui.region.lon.toFixed(1) });
  report('probe card shows local climate', doc.getElementById('probeBody').querySelectorAll('dd').length > 5);
  report('charts switch to the region scope', doc.getElementById('scopeLabel').textContent !== '全球平均',
    doc.getElementById('scopeLabel').textContent);
  doc.getElementById('btnClearRegion').click();
  await sleep(250);
  report('region can be cleared', api.state.ui.region === null);

  /* ---------------- charts drawn ---------------- */
  const painted = Array.from(doc.querySelectorAll('#charts .chart-canvas')).filter((c) => {
    const ctx = c.getContext('2d');
    const px = ctx.getImageData(0, 0, Math.min(48, c.width), Math.min(48, c.height)).data;
    for (let i = 3; i < px.length; i += 4) if (px[i] > 0) return true;
    return false;
  });
  report('chart canvases are rendered', painted.length === chartCards.length,
    { total: chartCards.length, painted: painted.length });

  const values = Array.from(doc.querySelectorAll('#metricGrid .m-value')).map((n) => n.textContent.trim());
  // The 12-month mean legitimately reads "—" until a full year of history exists,
  // so it is allowed to be blank; every other card must always carry a number.
  const annualIdx = 1;
  const othersFilled = values.every((v, i) => i === annualIdx || v.length > 0);
  report('metric cards all show a value',
    values.length === 7 && othersFilled && (values[annualIdx] === '—' || values[annualIdx].length > 0),
    values);

  /* ---------------- parameter change reaches the physics ---------------- */
  api.state.params.co2 = 2500;
  api.paramPanel.onChange();
  const tBefore = world.tGlobal;
  for (let i = 0; i < 240; i++) world.step(1);
  report('raising CO2 warms the planet', world.tGlobal > tBefore,
    { before: +tBefore.toFixed(2), after: +world.tGlobal.toFixed(2) });

  /* ---------------- undo / redo ---------------- */
  const mod = await import('/src/state/state.js');
  api.state.history.past.length = 0;
  api.state.history.future.length = 0;
  const irr0 = mod.get('irradiance');
  mod.set('irradiance', irr0 + 120);
  const irr1 = mod.get('irradiance');
  mod.undo();
  const irr2 = mod.get('irradiance');
  mod.redo();
  report('undo restores a parameter', irr2 === irr0, { from: irr0, set: irr1, undone: irr2 });
  report('redo re-applies a parameter', mod.get('irradiance') === irr1);

  /* ---------------- parameter lock ---------------- */
  const lockBtn = doc.querySelector('#paramSections .prow[data-key="irradiance"] .lock-btn');
  lockBtn.click();
  report('lock button toggles a parameter lock', api.state.locks.has('irradiance'),
    { locks: api.state.locks.size });
  lockBtn.click();
  report('lock can be released', !api.state.locks.has('irradiance'));

  /* ---------------- presets ---------------- */
  const presets = await import('/src/state/presets.js');
  const presetTemps = {};
  let presetsOk = true;
  for (const id of ['mars', 'venus', 'snowball', 'archipelago', 'ice-moon']) {
    api.applyPreset(id);
    await sleep(120);
    const w = api.world();
    for (let i = 0; i < 36; i++) w.step(1);
    presetTemps[id] = +w.tGlobal.toFixed(1);
    if (!isFinite(w.tGlobal) || w.tGlobal < 60 || w.tGlobal > 700) presetsOk = false;
  }
  report('every tested preset builds a valid world', presetsOk, presetTemps);
  report('preset roster is complete', presets.PRESETS.length === 13, presets.PRESETS.length);

  /* ---------------- creation wizard ---------------- */
  const wiz = api.wizard;
  doc.getElementById('btnNewPlanet').click();
  await sleep(150);
  report('wizard opens', !doc.getElementById('wizard').classList.contains('hidden'));
  let wizardErr = null;
  try {
    for (const step of [1, 2, 3, 4]) { wiz.setStep(step); await sleep(80); }
    report('wizard steps render parameter fields',
      doc.querySelectorAll('#wizPanes .field').length > 5,
      { fields: doc.querySelectorAll('#wizPanes .field').length });
    // return to the terrain step so its canvas and toolkit are live
    wiz.setStep(3);
    await sleep(120);
    const terr = doc.getElementById('wizTerrain');
    report('wizard has a terrain canvas', !!terr,
      { step: wiz.step, toolkit: !!wiz.toolkit, w: terr && terr.width, h: terr && terr.height });
    const tk = wiz.toolkit;
    if (!tk) report('wizard built a terrain toolkit', false, 'toolkit is null');
    if (tk) {
      // sample the cell at 0°N 0°E — NOT height.length/2, which lands on the
      // antimeridian and is never touched by a brush centred on the prime meridian
      const sampleIdx = Math.floor((90 - 0) / 180 * tk.grid.GY) * tk.grid.GX +
        Math.floor((0 + 180) / 360 * tk.grid.GX);
      const h0 = tk.grid.height[sampleIdx];
      tk.tview.tool = 'raise';
      tk.tview.strength = 1;
      const paintInfo = {
        gx: tk.grid.GX, gy: tk.grid.GY, idx: sampleIdx,
        lat: 90 - (Math.floor(sampleIdx / tk.grid.GX) + 0.5) / tk.grid.GY * 180,
        lon: (sampleIdx % tk.grid.GX + 0.5) / tk.grid.GX * 360 - 180,
        radius: tk.tview.radius, strength: tk.tview.strength,
        limits: tk.tview.limits, sameGrid: tk.tview.getGrid() === tk.grid,
      };
      tk.tview.stroke({ lat: 0, lon: 0 });
      const h1 = tk.grid.height[sampleIdx];
      paintInfo.before = Math.round(h0);
      paintInfo.after = Math.round(h1);
      // river routing needs land, and the previous preset may have been 100%
      // ocean, so force an Earth-like land/ocean split before checking
      wiz.values.oceanFraction = 70;
      tk.regenerate(wiz.values);
      tk.recomputeRivers();
      let rivers = 0;
      for (let i = 0; i < tk.grid.river.length; i++) if (tk.grid.river[i] > 0) rivers++;
      paintInfo.rivers = rivers;
      report('terrain brush edits the height field', Math.abs(h1 - h0) > 1, paintInfo);
      report('river routing produces channels', rivers > 50, { cells: rivers });
      wiz.mode = 'manual';
      wiz.setStep(3);
      await sleep(60);
      report('manual mode still offers terrain tools', !!wiz.toolkit);
    }
  } catch (e) { wizardErr = (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e.message); }
  report('wizard walkthrough without errors', wizardErr === null, wizardErr);

  wiz.setStep(1);
  doc.getElementById('wizCreate').click();
  await sleep(500);
  const created = api.world();
  report('wizard creates a fresh planet', created.time.month === 0,
    { name: created.name, cells: created.terrain.height.length });

  /* ---------------- terrain editor modal ---------------- */
  let teErr = null;
  try {
    doc.getElementById('btnTerrain').click();
    await sleep(250);
    report('terrain editor opens', !doc.getElementById('terrainEditor').classList.contains('hidden'));
    const tec = doc.getElementById('teCanvas');
    const r = tec.getBoundingClientRect();
    const opts = { bubbles: true, clientX: r.left + r.width * 0.3, clientY: r.top + r.height * 0.4, pointerId: 2 };
    tec.dispatchEvent(new cw.PointerEvent('pointerdown', opts));
    tec.dispatchEvent(new cw.PointerEvent('pointermove', Object.assign({}, opts, { clientX: opts.clientX + 60 })));
    tec.dispatchEvent(new cw.PointerEvent('pointerup', opts));
    const before = checksum(created.terrain.height);
    doc.getElementById('teApply').click();
    await sleep(600);
    const after = checksum(api.world().terrain.height);
    report('terrain editor applies changes to the world', before !== after,
      { before, after, cells: api.world().terrain.height.length });
  } catch (e) { teErr = e.message; }
  report('terrain editor flow without errors', teErr === null, teErr);

  /* ---------------- timeline scrubbing ---------------- */
  let scrubErr = null;
  try {
    const w = api.world();
    for (let i = 0; i < 120; i++) w.step(1);
    const scrub = doc.getElementById('timeScrub');
    scrub.value = '20';
    scrub.dispatchEvent(new cw.Event('input', { bubbles: true }));
    await sleep(600);
    report('scrubbing seeks the world back in time', w.time.month < 120,
      { month: +w.time.month.toFixed(1), history: w.history.items.length });
    doc.getElementById('btnScrubLive').click();
    await sleep(600);
    report('returning to live restores the newest month', w.time.month >= 119, +w.time.month.toFixed(1));
  } catch (e) { scrubErr = e.message; }
  report('timeline scrubbing without errors', scrubErr === null, scrubErr);

  /* ---------------- branches ---------------- */
  let branchErr = null;
  try {
    const before = api.state.branches.length;
    doc.getElementById('btnBranch').click();
    await sleep(250);
    report('creating a branch adds a parallel timeline', api.state.branches.length === before + 1,
      { before, after: api.state.branches.length, options: doc.getElementById('branchSel').options.length });
    const sel = doc.getElementById('branchSel');
    sel.value = '0';
    sel.dispatchEvent(new cw.Event('change', { bubbles: true }));
    await sleep(250);
    report('switching between branches works', api.state.activeBranch === 0);
  } catch (e) { branchErr = e.message; }
  report('branch flow without errors', branchErr === null, branchErr);

  /* ---------------- save / load ---------------- */
  let saveErr = null;
  try {
    doc.getElementById('btnSave').click();
    await sleep(150);
    report('save dialog lists eight slots', doc.querySelectorAll('#slotList .slot').length === 8);
    const saveBtn = doc.querySelector('#slotList .ctl-btn.primary');
    if (saveBtn) saveBtn.click();
    await sleep(400);
    const keys = Object.keys(cw.localStorage).filter((k) => k.startsWith('pcs.slot.'));
    report('save writes a slot to localStorage', keys.length >= 1, { slots: keys.length });
    api.state.params.co2 = 12345;
    doc.getElementById('btnLoad').click();
    await sleep(150);
    const loadBtn = Array.from(doc.querySelectorAll('#slotList .ctl-btn')).find((b) => b.textContent.indexOf('载入') >= 0);
    if (loadBtn) loadBtn.click();
    await sleep(900);
    report('loading a slot restores the saved scene', api.state.params.co2 !== 12345,
      { co2: Math.round(api.state.params.co2) });
  } catch (e) { saveErr = e.message; }
  report('save/load flow without errors', saveErr === null, saveErr);

  /* ---------------- scene round trip ---------------- */
  let sceneErr = null;
  let sceneBytes = 0;
  try {
    api.applyPreset('earth');
    await sleep(500);
    for (let i = 0; i < 60; i++) api.world().step(1);
    const scene = api.serializeScene();
    const json = JSON.stringify(scene);
    sceneBytes = json.length;
    api.applyScene(JSON.parse(json));
    await sleep(400);
    report('scene round-trips through JSON', api.state.params.o2 > 0,
      { bytes: sceneBytes, version: scene.version });
  } catch (e) { sceneErr = e.message; }
  report('scene serialisation without errors', sceneErr === null, sceneErr);

  /* ---------------- units ---------------- */
  const unitSel = doc.getElementById('unitSel');
  const readTemp = () => doc.querySelector('#metricGrid .m-value').textContent.trim();
  const unitProbe = { initial: readTemp(), system0: api.state.unitSystem };
  unitSel.value = 'kelvin';
  unitSel.dispatchEvent(new cw.Event('change', { bubbles: true }));
  await sleep(300);
  unitProbe.afterKelvinEvent = { text: readTemp(), system: api.state.unitSystem };
  const stateMod2 = await import('/src/state/state.js');
  stateMod2.setUnitSystem('kelvin');
  api.dataPanel.draw(true);
  await sleep(200);
  unitProbe.afterDirectCall = { text: readTemp(), system: api.state.unitSystem };
  unitSel.value = 'metric';
  unitSel.dispatchEvent(new cw.Event('change', { bubbles: true }));
  await sleep(250);
  unitProbe.backToMetric = { text: readTemp(), system: api.state.unitSystem };
  report('unit switch changes the displayed temperature',
    unitProbe.initial !== unitProbe.afterDirectCall.text && unitProbe.afterDirectCall.text !== unitProbe.backToMetric.text,
    unitProbe);

  /* ---------------- exports ---------------- */
  const origCreate = cw.URL.createObjectURL;
  const origClick = cw.HTMLAnchorElement.prototype.click;
  const exportResults = {};
  cw.URL.createObjectURL = function (blob) { exportResults._size = blob.size; exportResults._type = blob.type; return 'blob:test'; };
  cw.HTMLAnchorElement.prototype.click = function () {};
  let exportErr = null;
  try {
    for (const kind of ['series', 'grid', 'params', 'scene', 'png']) {
      doc.getElementById('btnExport').click();
      await sleep(150);
      const btn = doc.querySelector('#exportModal [data-export="' + kind + '"]');
      btn.click();
      await sleep(700);
      exportResults[kind] = (exportResults._size || 0) + 'B';
    }
  } catch (e) { exportErr = e.message; }
  cw.URL.createObjectURL = origCreate;
  cw.HTMLAnchorElement.prototype.click = origClick;
  report('every export path produces output', exportErr === null, exportResults);

  /* ---------------- view presets + flat projection ---------------- */
  let viewErr = null;
  try {
    const gp = api.globePane;
    const canvas3d = doc.getElementById('globe');
    const canvas2d = doc.getElementById('flatmap');

    gp.setViewPreset('northPole');
    await sleep(200);
    const northPitch = gp.globe.rot.pitch;
    gp.setViewPreset('southPole');
    await sleep(200);
    const southPitch = gp.globe.rot.pitch;
    gp.setViewPreset('equator');
    await sleep(200);
    const eqPitch = gp.globe.rot.pitch;
    // pitch convention: 0 = north pole centred, π/2 (here −π/2) = equator, π = south pole
    report('view presets orient the globe north / south / equator',
      Math.abs(northPitch) < 0.01 && Math.abs(Math.abs(southPitch) - Math.PI) < 0.01 && Math.abs(Math.abs(eqPitch) - Math.PI / 2) < 0.01,
      { north: +northPitch.toFixed(3), south: +southPitch.toFixed(3), equator: +eqPitch.toFixed(3) });

    // each preset must actually put the named feature in the middle of the canvas
    const centreOffset = (lat, lon) => {
      const p = gp.globe.project(lat, lon);
      const r = doc.getElementById('globe').getBoundingClientRect();
      return p ? Math.hypot(p.x - r.width / 2, p.y - r.height / 2) : 1e9;
    };
    gp.setViewPreset('northPole', 0);
    await sleep(150);
    const offNorth = centreOffset(90, 0);
    gp.setViewPreset('southPole', 0);
    await sleep(150);
    const offSouth = centreOffset(-90, 0);
    gp.setViewPreset('equator', 0);
    await sleep(150);
    const offEq = centreOffset(0, 0);
    report('赤道 / 北极 / 南极 centre exactly what they name',
      offNorth < 2 && offSouth < 2 && offEq < 2,
      { px: { north: +offNorth.toFixed(2), south: +offSouth.toFixed(2), equator: +offEq.toFixed(2) } });

    // the 视角 column offers exactly two big options, and the pole/equator reset
    // row only appears while the 3D view is active
    const viewSegBtns = Array.from(doc.querySelectorAll('#viewSeg .seg-btn')).map((b) => b.dataset.view);
    const presetRow = doc.getElementById('viewPresetRow');
    const presetBtns = Array.from(doc.querySelectorAll('#viewPresetSeg .seg-btn')).map((b) => b.dataset.view);
    report('视角 column is split into 3D and 平面',
      viewSegBtns.length === 2 && viewSegBtns[0] === 'globe' && viewSegBtns[1] === 'flat',
      { buttons: viewSegBtns });
    report('3D mode offers reset-to equator / north pole / south pole',
      presetBtns.join(',') === 'equator,northPole,southPole' && !presetRow.classList.contains('hidden'),
      { buttons: presetBtns, hidden: presetRow.classList.contains('hidden') });

    doc.querySelector('#viewPresetSeg [data-view="northPole"]').click();
    await sleep(250);
    report('the reset row drives the globe',
      gp.viewMode === 'globe' && Math.abs(gp.globe.rot.pitch) < 0.01 && gp.viewPreset === 'northPole',
      { pitch: +gp.globe.rot.pitch.toFixed(3), preset: gp.viewPreset });

    gp.setViewPreset('flat');
    await sleep(350);
    report('the reset row hides in flat mode', presetRow.classList.contains('hidden'),
      { hidden: presetRow.classList.contains('hidden') });
    gp.setViewPreset('globe');
    await sleep(250);
    report('the reset row returns in 3D mode', !presetRow.classList.contains('hidden'),
      { hidden: presetRow.classList.contains('hidden') });

    gp.setViewPreset('flat');
    await sleep(350);
    report('flat projection switches the visible canvas',
      gp.viewMode === 'flat' && !canvas2d.classList.contains('hidden') && canvas3d.classList.contains('hidden'),
      { mode: gp.viewMode });

    // the flat map must actually paint something (sample the middle band, where
    // the map is drawn — the top-left corner is background padding)
    const mid = gp.map2d;
    mid.reset();
    mid.render(true);
    const fctx = canvas2d.getContext('2d');
    const sw = Math.min(320, canvas2d.width);
    const sh = Math.min(160, canvas2d.height);
    const sx = Math.floor((canvas2d.width - sw) / 2);
    const sy = Math.floor((canvas2d.height - sh) / 2);
    const fpx = fctx.getImageData(sx, sy, sw, sh).data;
    const fcolors = new Set();
    for (let i = 0; i < fpx.length; i += 4) fcolors.add((fpx[i] >> 4) + ',' + (fpx[i + 1] >> 4) + ',' + (fpx[i + 2] >> 4));
    report('flat map renders the terrain', fcolors.size > 6, { colors: fcolors.size, canvas: canvas2d.width + 'x' + canvas2d.height });

    const centreBefore = mid.cx;
    for (let i = 0; i < 4; i++) gp.handleArrow(1, 0, false);   // ArrowRight
    report('arrow keys pan the flat map',
      Math.abs(mid.cx - centreBefore) > 1e-4, { before: +centreBefore.toFixed(4), after: +mid.cx.toFixed(4) });
    for (let i = 0; i < 12; i++) gp.handleArrow(1, 0, false);
    report('flat map panning wraps horizontally (stays in 0..1)',
      mid.cx >= 0 && mid.cx <= 1, { cx: +mid.cx.toFixed(3) });

    // at zoom 1 the whole latitude range fits the viewport, so vertical panning
    // is (correctly) locked to the centre — zoom in first, then it must move
    mid.zoomBy(2.5);
    const latBefore = mid.cy;
    gp.handleArrow(0, -1, false);   // ArrowUp -> shift latitude band north
    const latAfter = mid.cy;
    report('arrow keys shift the latitude band when zoomed in', Math.abs(latAfter - latBefore) > 1e-4,
      { before: +latBefore.toFixed(4), after: +latAfter.toFixed(4), zoom: +mid.zoom.toFixed(2) });
    mid.reset();

    const wheelZoom = (() => {
      const z0 = mid.zoom;
      mid.zoomBy(2);
      const z1 = mid.zoom;
      mid.zoomBy(0.5);
      return { z0: +z0.toFixed(3), z1: +z1.toFixed(3) };
    })();
    report('flat map zooms', Math.abs(wheelZoom.z1 - wheelZoom.z0 * 2) < 1e-6, wheelZoom);

    gp.setViewPreset('globe');
    await sleep(300);
    report('switching back to 3D restores the globe canvas',
      gp.viewMode === 'globe' && !canvas3d.classList.contains('hidden') && canvas2d.classList.contains('hidden'),
      { mode: gp.viewMode });
  } catch (e) { viewErr = (e && e.stack ? e.stack.split('\n').slice(0, 2).join(' | ') : e.message); }
  report('view preset + flat map flow without errors', viewErr === null, viewErr);

  /* ---------------- day/night shadow toggle ---------------- */
  let shadowErr = null;
  try {
    const g2 = api.globePane.globe;
    g2.sun.shadow = true;
    g2.render(0);
    const w2 = g2.canvas.width, h2 = g2.canvas.height;
    const readMean = () => {
      g2.render(0);
      const px = new Uint8Array(w2 * h2 * 4);
      g2.gl.readPixels(0, 0, w2, h2, g2.gl.RGBA, g2.gl.UNSIGNED_BYTE, px);
      let sum = 0, dark = 0, n = w2 * h2;
      for (let i = 0; i < px.length; i += 4) {
        const lum = px[i] + px[i + 1] + px[i + 2];
        sum += lum / 3;
        if (lum < 90) dark++;
      }
      return { mean: +(sum / n).toFixed(2), darkFraction: +(dark / n).toFixed(3) };
    };
    const withShadow = readMean();
    g2.sun.shadow = false;
    const withoutShadow = readMean();
    report('shadow toggle removes the dark hemisphere',
      withoutShadow.mean > withShadow.mean && withoutShadow.darkFraction < withShadow.darkFraction,
      { withShadow, withoutShadow });

    // and it is wired to the HUD checkbox
    const box = doc.getElementById('chkShadow');
    g2.sun.shadow = false;
    box.checked = true;
    box.dispatchEvent(new cw.Event('change', { bubbles: true }));
    await sleep(120);
    const afterCheck = g2.sun.shadow;
    box.checked = false;
    box.dispatchEvent(new cw.Event('change', { bubbles: true }));
    await sleep(120);
    report('shadow checkbox drives the globe', afterCheck === true && g2.sun.shadow === false,
      { afterCheck, final: g2.sun.shadow });
    box.checked = true;
    box.dispatchEvent(new cw.Event('change', { bubbles: true }));
  } catch (e) { shadowErr = (e && e.stack ? e.stack.split('\n').slice(0, 2).join(' | ') : e.message); }
  report('shadow toggle flow without errors', shadowErr === null, shadowErr);

  /* ---------------- meteor group (陨石) ---------------- */
  let meteorErr = null;
  try {
    const keys = ['meteorEnabled', 'meteorMonth', 'meteorEndMonth', 'meteorMass', 'meteorCount', 'meteorMassSigma'];
    const missing = keys.filter((k) => !doc.querySelector(`#paramSections .prow[data-key="${k}"]`));
    report('parameter panel has the 陨石 group', missing.length === 0, missing);
    const groupTitles = Array.from(doc.querySelectorAll('#paramSections .psec-title')).map((n) => n.textContent);
    report('the 陨石 group is labelled', groupTitles.indexOf('陨石') >= 0, groupTitles);

    // drive an impact directly through the world API
    const w = api.world();
    // write through the world's own parameter bag: a scene load replaces
    // state.params, so `api.state.params` is not guaranteed to be the live one
    const wp = w.params;
    const saved = { meteorEnabled: wp.meteorEnabled, meteorMonth: wp.meteorMonth, meteorEndMonth: wp.meteorEndMonth };
    wp.meteorEnabled = true;
    wp.meteorMonth = w.time.month + 2;
    // end === start: an instantaneous shower, which is what a single-point
    // bombardment means now that the window exists
    wp.meteorEndMonth = wp.meteorMonth;
    wp.meteorMass = 1e15;
    wp.meteorCount = 4;
    wp.meteorMassSigma = 0.5;
    for (let i = 0; i < 3; i++) w.step(1);
    const imp = w.impact;
    report('a meteor shower fires at the chosen month and injects dust',
      !!imp && imp.count === 4 && imp.load > 0.5 && w.impactDust > 0.5,
      { enabled: wp.meteorEnabled, at: wp.meteorMonth, month: +w.time.month.toFixed(1),
        impact: imp ? { count: imp.count, total: imp.total.toExponential(2), load: +imp.load.toFixed(3), dust: +w.impactDust.toFixed(3) } : null });
    report('the shower perturbs the climate',
      !!imp && imp.heat > 0 && imp.masses.length === 4
      && Math.max(...imp.masses) > Math.min(...imp.masses) * 1.05,
      imp && { heat: +imp.heat.toFixed(1), masses: imp.masses.map((m) => +m.toExponential(1)) });

    // every meteor must land somewhere of its own
    {
      const sites = (imp && imp.sites) || [];
      const key = (s) => `${s.lat.toFixed(3)},${s.lon.toFixed(3)}`;
      const distinctSites = new Set(sites.map(key)).size;
      const spread = sites.length
        ? Math.max(...sites.map((s) => s.lat)) - Math.min(...sites.map((s) => s.lat))
        : 0;
      report('each meteor lands at its own random site',
        sites.length === 4 && distinctSites === 4 && spread > 1,
        { sites: sites.length, distinct: distinctSites, latSpread: +spread.toFixed(1),
          coords: sites.map((s) => `${s.lat.toFixed(1)},${s.lon.toFixed(1)}`) });
      report('meteors are drawn over the whole sphere, poles included',
        sites.length >= 4 && sites.every((s) => Math.abs(s.lat) <= 90.001),
        sites.map((s) => +s.lat.toFixed(1)));
    }

    report('the impact survives a snapshot round-trip',
      (() => {
        const snap = w.snapshot();
        const kept = !!snap.impact && snap.impact.count === 4 && (snap.impacts || []).length === 4;
        w.impact = null;
        w.impacts = null;
        w.restore(snap);
        return kept && !!w.impact && (w.impacts || []).length === 4;
      })(), null);
    report('the impact reports a blast footprint for the animation',
      !!imp && imp.radiusDeg > 0 && imp.blastKm > 0,
      imp && { radiusDeg: +imp.radiusDeg.toFixed(2), blastKm: Math.round(imp.blastKm) });
    report('the impact starts the on-globe animation',
      !!api.globePane.impactAnim && !!imp
      && Math.abs(api.globePane.impactAnim.lat - imp.site.lat) < 1e-6
      && !doc.getElementById('vectorLayer').classList.contains('hidden'),
      api.globePane.impactAnim ? {
        lat: +api.globePane.impactAnim.lat.toFixed(2),
        lon: +api.globePane.impactAnim.lon.toFixed(2),
        radiusDeg: +api.globePane.impactAnim.radiusDeg.toFixed(2),
      } : null);
    let impactDrawErr = null;
    try { api.globePane.render(0.016, api.world()); } catch (e) { impactDrawErr = String(e.message); }
    report('the impact animation renders without errors', impactDrawErr === null, impactDrawErr);
    // The *mass* reservoir is the quantity that decays exponentially (dust settles out
    // with a ~2.2 yr e-folding); the dust load is that mass mapped through a
    // logarithmic production curve, so it falls more slowly by construction. Testing
    // the mass is therefore the meaningful claim, and the load must still come down.
    const massStart = w.dustReservoir(w.time.month);
    const loadStart = w.impactDust;
    for (let i = 0; i < 24; i++) w.step(1);
    const massEnd = w.dustReservoir(w.time.month);
    const ratio = massEnd / Math.max(1e-9, massStart);
    report('the impact dust reservoir decays over a couple of years',
      !imp || (ratio < 0.5 && ratio > 0.15 && w.impactDust < loadStart),
      imp ? {
        massStart: massStart.toExponential(2), massEnd: massEnd.toExponential(2),
        retained: +ratio.toFixed(3), loadStart: +loadStart.toFixed(3),
        loadAfter2yr: +w.impactDust.toFixed(3),
      } : { impact: null });
    // and once the shower is cleared the sky must clear with it
    w.impact = null;
    w.impacts = null;
    w.refreshFields();
    report('clearing the impacts clears the dust', w.impactDust === 0, { dust: w.impactDust });
    wp.meteorEnabled = saved.meteorEnabled;
    wp.meteorMonth = saved.meteorMonth;
    wp.meteorEndMonth = saved.meteorEndMonth;

    // A bombardment window, on a world of its own. This has to run *after* the
    // animation assertions above: `triggerImpacts` emits on the app-wide bus, so
    // stepping a second world would otherwise repaint the live animation with that
    // world's sites. The second world also gets a *copy* of the parameter bag —
    // World keeps the reference it is handed, so passing wp would rewrite the live
    // world's own meteor settings.
    {
      const w2 = new (Object.getPrototypeOf(w).constructor)({ ...wp }, { seed: 4242 });
      const p2 = w2.params;
      p2.meteorEnabled = true;
      p2.meteorMass = 1e15;
      p2.meteorCount = 12;
      p2.meteorMassSigma = 0.3;
      p2.meteorMonth = 6;
      p2.meteorEndMonth = 18;
      const seen = [];
      for (let m = 0; m < 20; m++) { w2.step(1); seen.push(w2.impacts ? w2.impacts.length : 0); }
      const months = Array.from(new Set((w2.impacts || []).map((m) => m.month))).sort((a, b) => a - b);
      report('a bombardment window spreads the impacts over time',
        !!w2.impacts && w2.impacts.length === 12 && months.length > 4
        && months[0] >= 6 && months[months.length - 1] <= 18,
        { total: w2.impacts ? w2.impacts.length : 0, distinctMonths: months.length,
          first: months[0], last: months[months.length - 1], firedByMonth: seen.filter((_, i) => i % 4 === 0) });
      report('a bombardment accumulates dust from every impact',
        w2.impactDust > 0.2 && w2.impactDust < 3.0001, { dust: +w2.impactDust.toFixed(3) });
      report('every meteor of a long bombardment still has its own site',
        (w2.impacts || []).length === 12
        && new Set((w2.impacts || []).map((m) => `${m.lat.toFixed(2)},${m.lon.toFixed(2)}`)).size === 12,
        null);
    }
  } catch (e) { meteorErr = (e && e.stack ? e.stack.split('\n').slice(0, 2).join(' | ') : e.message); }
  report('meteor flow without errors', meteorErr === null, meteorErr);

  /* ---------------- habitability (land only) + terrain-driven flow -------- */
  let habErr = null;
  try {
    const w = api.world();
    const g = w.grid;
    let oceanMax = 0, landSum = 0, landN = 0, oceanN = 0;
    for (let k = 0; k < g.n; k++) {
      if (g.ocean[k] > 0.5) { oceanN++; oceanMax = Math.max(oceanMax, g.habitability[k]); }
      else { landN++; landSum += g.habitability[k]; }
    }
    report('habitability is zero over the ocean', oceanMax === 0 && oceanN > 0,
      { oceanCells: oceanN, oceanMax });
    report('habitability is a meaningful land index',
      landN > 0 && landSum / landN > 0.2 && landSum / landN <= 1,
      { landCells: landN, landMean: +(landSum / landN).toFixed(3) });

    const habLayer = w.layerData('habitability');
    let layerOceanMax = 0;
    const t = w.terrain;
    for (let j = 0; j < t.GY; j += 2) {
      for (let i = 0; i < t.GX; i += 2) {
        if (!t.waterMask[j * t.GX + i]) continue;
        layerOceanMax = Math.max(layerOceanMax, habLayer[j * t.GX + i]);
      }
    }
    report('the 宜居度 layer is blank over water', layerOceanMax === 0, { value: layerOceanMax });

    // rivers must actually reach the index
    let onRiver = 0, nRiver = 0, offRiver = 0, nOff = 0;
    for (let k = 0; k < g.n; k++) {
      if (g.ocean[k] > 0.5) continue;
      if (g.riverNear[k] > 0.1) { onRiver += g.habitability[k]; nRiver++; }
      else { offRiver += g.habitability[k]; nOff++; }
    }
    report('river proximity raises habitability',
      nRiver > 0 && nOff > 0 && (onRiver / nRiver) > (offRiver / nOff) * 1.03,
      { nearRiver: +(onRiver / Math.max(1, nRiver)).toFixed(3), away: +(offRiver / Math.max(1, nOff)).toFixed(3) });

    // terrain-driven wind and wind-driven currents
    let liftMax = 0;
    for (let k = 0; k < g.n; k++) liftMax = Math.max(liftMax, Math.abs(g.windLift[k]));
    report('terrain drives the wind field (orographic lift)', liftMax > 1, { maxLift: +liftMax.toFixed(2) });
    const curWithWind = w.currentSpeedMean;
    const savedAtmos = w.params.atmosphericCirculation;
    w.params.atmosphericCirculation = 0;
    for (let n = 0; n < 3; n++) w.step(1);
    const curNoWind = w.currentSpeedMean;
    w.params.atmosphericCirculation = savedAtmos;
    // put the wind field back before anything else inspects it
    for (let n = 0; n < 2; n++) w.step(1);
    report('the wind field drives the ocean currents', curNoWind < curWithWind,
      { withWind: +curWithWind.toFixed(3), withoutWind: +curNoWind.toFixed(3) });
  } catch (e) { habErr = (e && e.stack ? e.stack.split('\n').slice(0, 2).join(' | ') : e.message); }
  report('habitability + terrain-flow flow without errors', habErr === null, habErr);

  /* ---------------- vector layers (风场 / 洋流) + legend editor ---------------- */
  let vecErr = null;
  try {
    const gp = api.globePane;
    const vecCanvas = doc.getElementById('vectorLayer');
    // A meteor animation from an earlier section legitimately keeps the overlay
    // canvas visible and drawing; this section is about the *vector* overlay.
    gp.impactAnim = null;
    // Headless browsers throttle rAF for off-screen iframes, so drive one frame
    // explicitly instead of waiting for the animation loop.
    const frame = () => { try { gp.render(0.016, api.world()); } catch (e) { report('vector render threw', false, String(e.message)); } };

    gp.setViewPreset('globe');
    frame();
    gp.setOverlay('windSpeed');
    frame();
    report('风场 layer shows a vector overlay',
      !vecCanvas.classList.contains('hidden') && gp.vectorCount > 0,
      { visible: !vecCanvas.classList.contains('hidden'), arrows: gp.vectorCount,
        skip: gp.vectorSkip || null, overlay: api.state.ui.overlay,
        canvas: !!api.globePane.vectors && !!api.globePane.vectors.canvas });

    const vctx = vecCanvas.getContext('2d');
    const vpx = vctx.getImageData(0, 0, vecCanvas.width, vecCanvas.height).data;
    let painted = 0;
    for (let i = 3; i < vpx.length; i += 4 * 37) if (vpx[i] > 8) painted++;
    report('vector overlay actually paints arrows', painted > 20, { painted });
    report('legend marks the vector layers',
      doc.getElementById('legendTicks').textContent.indexOf('箭头方向') >= 0,
      doc.getElementById('legendTicks').textContent);

    gp.setOverlay('currentSpeed');
    frame();
    report('洋流 layer shows a vector overlay', gp.vectorCount > 0, { arrows: gp.vectorCount });

    // flat-map vectors
    gp.setViewPreset('flat');
    frame();
    const flatPainted = (() => {
      const px = vctx.getImageData(0, 0, vecCanvas.width, vecCanvas.height).data;
      let n = 0;
      for (let i = 3; i < px.length; i += 4 * 37) if (px[i] > 8) n++;
      return n;
    })();
    report('flat map also draws the flow field', gp.vectorCount > 0 && flatPainted > 10,
      { arrows: gp.vectorCount, painted: flatPainted });

    // switching to a scalar layer hides the arrows again
    gp.setOverlay('temperature');
    frame();
    report('scalar layers hide the vector overlay', vecCanvas.classList.contains('hidden') && gp.vectorCount === 0,
      { hidden: vecCanvas.classList.contains('hidden'), arrows: gp.vectorCount, skip: gp.vectorSkip || null });
    gp.setViewPreset('globe');
    frame();

    /* ---- legend / colourbar editor ---- */
    const legendBar = doc.getElementById('legendBar');
    const editor = doc.getElementById('legendEditor');
    report('legend editor starts closed', editor.classList.contains('hidden'));
    legendBar.click();
    await sleep(200);
    report('clicking the colourbar opens the legend editor', !editor.classList.contains('hidden'),
      { hidden: editor.classList.contains('hidden') });

    const ramps = doc.querySelectorAll('#legendRamps .le-ramp');
    report('legend editor offers ten colourbars', ramps.length >= 10, { count: ramps.length });
    const gradientBefore = legendBar.style.background;
    ramps[2].click();
    await sleep(250);
    report('choosing a colourbar updates the legend gradient',
      api.state.ui.layerRamp.temperature === ramps[2].getAttribute('data-ramp')
      && legendBar.style.background !== gradientBefore && !!legendBar.style.background,
      { chosen: api.state.ui.layerRamp.temperature, changed: legendBar.style.background !== gradientBefore });

    // The bug this guards: changing the colourbar recoloured the legend swatch but
    // not the map. The overlay texture carries raw values and the shader colours them
    // through a 256px LUT that was only re-uploaded on a layer *switch*, and the flat
    // map baked LAYERS[key].ramp (the registered default) rather than the user's
    // choice. So compare map pixels, not the legend.
    {
      const gp2 = api.globePane;
      gp2.setViewPreset('globe');
      gp2.setOverlay('temperature');
      await sleep(300);
      frame();
      const g2 = gp2.globe;
      const gl2 = g2.gl;
      const sampleMap = () => {
        const w2 = Math.min(256, g2.canvas.width), h2 = Math.min(256, g2.canvas.height);
        const px = new Uint8Array(w2 * h2 * 4);
        gl2.readPixels(0, 0, w2, h2, gl2.RGBA, gl2.UNSIGNED_BYTE, px);
        let sum = 0, lit = 0;
        for (let i = 0; i < px.length; i += 4) {
          const lum = px[i] + px[i + 1] + px[i + 2];
          if (lum > 90) { lit++; sum += lum; }
        }
        return lit ? sum / lit : 0;
      };
      const flatHash = () => {
        const cv = gp2.overlayCanvas;
        if (!cv) return null;
        const n = Math.min(32, cv.width), m2 = Math.min(32, cv.height);
        const d = cv.getContext('2d').getImageData(0, 0, n, m2).data;
        let h = 0; for (let i = 0; i < d.length; i++) h = (h * 31 + d[i]) >>> 0;
        return h;
      };
      const mapBefore = sampleMap();
      const flatBefore = flatHash();
      ramps[5].click();
      await sleep(300);
      frame();
      const mapAfter = sampleMap();
      const flatAfter = flatHash();
      report('choosing a colourbar re-colours the globe itself',
        Math.abs(mapAfter - mapBefore) > 0.4,
        { before: +mapBefore.toFixed(2), after: +mapAfter.toFixed(2), ramp: api.state.ui.layerRamp.temperature });

  const { World } = await import('/src/world/world.js');

  const { transportAirStep } = await import('/src/physics/climate.js');
  // appDefaultParams runs the very same applyAutoRules the app runs at startup, so
  // these numbers are the ones the panel shows. Re-implementing the rules by hand is
  // exactly what let a "calibrated in Node, snowballing in the browser" mismatch
  // survive: the hand-rolled version fed defaults().humidity (68) into the cloud rule,

  const earthParams = () => appDefaultParams(defaults);

  const pw = new World(earthParams(), { seed: defaults().seed });
  const annualMarks = [];
  for (let yr = 1; yr <= 60; yr++) {

    if (yr === 1 || yr === 40 || yr === 60) annualMarks.push({ yr, t: pw.tGlobalAnnual });

  const yr1 = annualMarks[0].t, yr40 = annualMarks[1].t, yr60 = annualMarks[2].t;
  report('50-year integration stays bounded', isFinite(pw.tGlobal) && pw.tGlobal > 200 && pw.tGlobal < 340,
    +pw.tGlobal.toFixed(2));
  report('Earth default settles at an Earth-like 12-month mean',

  // conserved the unweighted band sum ΣT instead of Σ(cosφ·T), so every poleward
  // exchange quietly dropped heat. The conserved quantity must be the one the
  // global averages use.
  {
    const g = pw.grid;
    const weighted = () => {
      let acc = 0;
      for (let j = 0; j < g.NB; j++) acc += Math.cos((g.lats[j] * Math.PI) / 180) * g.airT[j];
      return acc;
    };
    for (let j = 0; j < g.NB; j++) {
      g.airT[j] = 320 - 60 * Math.pow(Math.abs(g.lats[j]) / 90, 2);
    }
    const before = weighted();
    transportAirStep(g, pw.params, 2.63e6);
    transportAirStep(g, pw.params, 2.63e6);
    const drift = Math.abs(weighted() - before) / Math.max(1, Math.abs(before));
    report('meridional transport conserves area-weighted heat', drift < 1e-9, drift.toExponential(2));
  }

  let poleAcc = 0;
  for (let i = 0; i < pw.grid.NL; i++) poleAcc += pw.grid.T[i];
  const poleT = poleAcc / pw.grid.NL;
  report('polar temperature is physical', poleT > 180 && poleT < 300, +poleT.toFixed(1));
  report('no non-finite values in climate fields', scanFinite(pw) === 0, { bad: scanFinite(pw) });

  /* ---------------- CO2 sensitivity ---------------- */
  const sensitivity = [];
  let sensLo = Infinity, sensHi = -Infinity;
  for (const co2 of [280, 420, 560, 840]) {
    const w2 = new World(Object.assign(earthParams(), { co2 }), { seed: 4242 });
    for (let i = 0; i < 480; i++) w2.step(1);
    sensitivity.push(co2 + 'ppm=' + w2.tGlobalAnnual.toFixed(2));
    sensLo = Math.min(sensLo, w2.tGlobalAnnual);
    sensHi = Math.max(sensHi, w2.tGlobalAnnual);
  }
  report('climate responds to CO2 across the range', sensHi > sensLo + 2, sensitivity);

  finish();
}

function finish() {
  const failed = results.filter((r) => !r.ok);
  log.push('');
  log.push('==== ' + (results.length - failed.length) + '/' + results.length + ' passed, ' + failed.length + ' failed ====');
  render();
  const payload = JSON.stringify({ total: results.length, failed: failed.length, results }, null, 1);
  fetch('/__result', { method: 'POST', body: payload })
    .then(() => { document.title = failed.length ? 'FAILED' : 'ALL PASS'; })
    .catch(() => { document.title = 'POST-FAILED'; });
}

main().catch((e) => { report('harness crashed', false, e.stack || e.message); finish(); });
</script>
